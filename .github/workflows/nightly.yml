name: Nightly

# Signs and publishes a nightly build of main as a GitHub pre-release tagged
# v<version>-nightly.<date>.<run>, which the launcher offers only in Developer
# mode (#1566; the owner's choice in chat, October 10). It skips a day when main
# hasn't changed or main's CI hasn't passed on the triggering commit, and keeps the
# seven newest nightly releases. See docs/development/releasing.md#nightly-builds.
on:
  schedule:
    # 21:17 UTC: 23:17 in Amsterdam in summer and 22:17 in winter, so the build
    # is ready by the owner's usual evening playtest (owner's choice, October 15).
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Publish a nightly, or the release version prepared on main
        type: choice
        options: [nightly, release]
        default: nightly
      release_tag:
        description: Prepared annotated tag (required for the release channel)
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nightly
  cancel-in-progress: false

# Only the publish job can write releases. Only steps that call gh get GH_TOKEN,
# and checkout keeps no credentials: restore, build and packaging never see it.
env:
  GH_REPO: ${{ github.repository }}
  KEEP_NIGHTLIES: 7
  RELEASE_CHANNEL: ${{ inputs.channel || 'nightly' }}
  RELEASE_TAG: ${{ inputs.release_tag || '' }}

jobs:
  choice-invariants:
    # Run even when release packaging skips an unchanged main commit.
    if: github.repository == 'ClankerWorldOrg/ClankerWorld'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CLANKERWORLD_CHOICE_SEED: '1815'
      CLANKERWORLD_CHOICE_SEEDS: '4'
      CLANKERWORLD_CHOICE_TICKS: '32'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ClankerWorld.Tests/ClankerWorld.Tests.csproj --locked-mode
      - name: Test every offered choice across hard-world seeds and ticks
        run: >-
          dotnet test tests/ClankerWorld.Tests/ClankerWorld.Tests.csproj
          -c Release --no-restore --filter FullyQualifiedName~OfferedChoiceInvariantTests
          --logger 'trx;LogFileName=choice-invariants.trx'
          --results-directory .evidence/choice-invariants
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-choice-invariants
          path: .evidence/choice-invariants
          if-no-files-found: ignore

  nightly:
    if: github.repository == 'ClankerWorldOrg/ClankerWorld' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether main needs a new nightly build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          if [[ "${RELEASE_CHANNEL}" == release ]]; then
            [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "$(git cat-file -t "refs/tags/${RELEASE_TAG}")" == tag ]]
            [[ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{}")" == "${sha}" ]]
          fi
          releases="$(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate)"
          last="$(jq -sr '[.[][] | select(.tag_name | test("^v[0-9.]+-nightly\\."))] | sort_by(.created_at) | last | .target_commitish // ""' <<<"${releases}")"
          if [[ "${RELEASE_CHANNEL}" != release && "${last}" == "${sha}" ]]; then
            echo "The newest nightly build already has ${sha}."
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          ci="$(gh run list --workflow ci.yml --branch main --commit "${sha}" --event push --limit 1 \
            --json conclusion --jq '.[0].conclusion // ""')"
          if [[ "${ci}" != "success" ]]; then
            echo "Main's CI hasn't passed on ${sha} (${ci:-no finished run}), so there is no nightly build today."
            echo "build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "build=true" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-dotnet@v5
        if: steps.decide.outputs.build == 'true'
        with:
          global-json-file: global.json
      - if: steps.decide.outputs.build == 'true'
        run: dotnet restore --locked-mode
      - name: Restore pinned Godot downloads
        if: steps.decide.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/clankerworld/tools/downloads
          key: godot-downloads-${{ hashFiles('scripts/verify-godot-client.sh', 'scripts/verify-godot-windows-export.sh') }}
      - name: Export and package the nightly build
        if: steps.decide.outputs.build == 'true'
        run: |
          if [[ "${RELEASE_CHANNEL}" != release ]]; then
            export VersionSuffix="nightly.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          bash scripts/verify-godot-windows-export.sh
          bash scripts/package-windows.sh
          bash scripts/verify-godot-windows-export.sh --launcher
          bash scripts/package-windows.sh --launcher export/launcher-windows-x64 export/launcher-package
      - name: Upload the nightly game package
        if: steps.decide.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-game
          path: export/package
          compression-level: 0
          if-no-files-found: error
      - name: Upload the nightly launcher package
        if: steps.decide.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-launcher
          path: export/launcher-package
          compression-level: 0
          if-no-files-found: error

  sign-game:
    needs: nightly
    if: github.repository == 'ClankerWorldOrg/ClankerWorld' && github.ref == 'refs/heads/main' && needs.nightly.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@v4
        with:
          name: nightly-game
          path: export/signed-game
      - uses: actions/download-artifact@v4
        with:
          name: nightly-launcher
          path: export/signed-launcher
      - name: Approve and verify the game and launcher with the workflow identity
        run: |
          for directory in export/signed-game export/signed-launcher; do
            package="$(find "$directory" -maxdepth 1 -name '*.zip' -print -quit)"
            test -n "$package"
            (cd "${package%/*}" && sha256sum --check --quiet --strict "${package##*/}.sha256")
            python3 scripts/sign-release-package.py sign "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: approved-game
          path: export/signed-game
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: approved-launcher
          path: export/signed-launcher
          compression-level: 0
          if-no-files-found: error

  windows-installer:
    needs: [nightly, sign-game]
    if: needs.nightly.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: approved-game
          path: ${{ runner.temp }}/installer-game
      - uses: actions/download-artifact@v4
        with:
          name: approved-launcher
          path: ${{ runner.temp }}/installer-launcher
      - name: Build the unsigned per-user setup with pinned Inno Setup
        run: |
          stage_root="$(cygpath -u "$RUNNER_TEMP")"
          game_zip="$(find "$stage_root/installer-game" -maxdepth 1 -name 'ClankerWorld-*-windows-x64.zip' -print -quit)"
          launcher_zip="$(find "$stage_root/installer-launcher" -maxdepth 1 -name 'ClankerWorld-Launcher-*-windows-x64.zip' -print -quit)"
          test -f "${game_zip}.sig"
          bash scripts/package-windows-installer.sh "$game_zip" "$launcher_zip" "$stage_root/installer-setup"
      - name: Upload the nightly setup and its SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: nightly-setup
          path: ${{ runner.temp }}/installer-setup
          compression-level: 0
          if-no-files-found: error

  sign-setup:
    needs: [nightly, windows-installer]
    if: github.repository == 'ClankerWorldOrg/ClankerWorld' && github.ref == 'refs/heads/main' && needs.nightly.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0
        with:
          cosign-release: v3.1.3
      - uses: actions/download-artifact@v4
        with:
          name: nightly-setup
          path: export/signed-setup
      - name: Approve and verify the completed installer with the workflow identity
        run: |
          package="$(find export/signed-setup -maxdepth 1 -name '*.exe' -print -quit)"
          test -n "$package"
          (cd "${package%/*}" && sha256sum --check --quiet --strict "${package##*/}.sha256")
          python3 scripts/sign-release-package.py sign "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: approved-setup
          path: export/signed-setup
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [nightly, sign-setup]
    if: github.ref == 'refs/heads/main' && needs.nightly.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: approved-game
          path: export/package
      - uses: actions/download-artifact@v4
        with:
          name: approved-setup
          path: export/setup
      - uses: actions/download-artifact@v4
        with:
          name: approved-launcher
          path: export/launcher
      - name: Publish the automatically approved release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="$(find export/package -maxdepth 1 -name 'ClankerWorld-*-windows-x64.zip' -print -quit)"
          name="$(basename "${zip}" .zip)"
          version="${name#ClankerWorld-}"
          version="${version%-windows-x64}"
          setup="export/setup/ClankerWorld-Setup-${version}-windows-x64.exe"
          launcher="$(find export/launcher -maxdepth 1 -name '*.zip' -print -quit)"
          for asset in "${zip}" "${setup}" "${launcher}"; do
            test -f "${asset}"
            test -s "${asset}.sig"
            (cd "${asset%/*}" && sha256sum --check --quiet --strict "${asset##*/}.sha256")
          done
          sha="${{ needs.nightly.outputs.sha }}"
          flags=(--latest=false)
          title="Nightly ${version}"
          notes="Automatically approved nightly build of main at ${sha}. For Developer mode; saved worlds may not open in other versions. Kept for ${KEEP_NIGHTLIES} newer nightly builds."
          note_flags=(--notes "${notes}")
          if [[ "${RELEASE_CHANNEL}" == release ]]; then
            [[ "v${version}" == "${RELEASE_TAG}" ]]
            tag_object="$(gh api "repos/${GH_REPO}/git/ref/tags/${RELEASE_TAG}" --jq '.object')"
            [[ "$(jq -r .type <<<"${tag_object}")" == tag ]]
            tag_sha="$(jq -r .sha <<<"${tag_object}")"
            target="$(gh api "repos/${GH_REPO}/git/tags/${tag_sha}" --jq '.object')"
            [[ "$(jq -r .type <<<"${target}")" == commit && "$(jq -r .sha <<<"${target}")" == "${sha}" ]]
            title="ClankerWorld ${version}"
            note_flags=(--notes-from-tag)
            [[ "${version}" == *-* ]] && flags+=(--prerelease) || flags=(--latest)
          else
            flags+=(--prerelease)
          fi
          gh release create "v${version}" --draft "${flags[@]}" --target "${sha}" \
            --title "${title}" "${note_flags[@]}" \
            "${zip}" "${zip}.sha256" "${zip}.sig" "${setup}" "${setup}.sha256" "${setup}.sig" \
            "${launcher}" "${launcher}.sha256" "${launcher}.sig"
          gh release edit "v${version}" --draft=false
      - name: Remove older nightly builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          releases="$(gh api "repos/${GH_REPO}/releases?per_page=100" --paginate)"
          jq -sr --argjson keep "${KEEP_NIGHTLIES}" \
            '[.[][] | select(.tag_name | test("^v[0-9.]+-nightly\\."))] | sort_by(.created_at) | reverse | .[$keep:] | .[] | [.tag_name, (.draft // false)] | @tsv' <<<"${releases}" |
          while IFS=$'\t' read -r tag draft; do
            echo "Removing ${tag}"
            cleanup=()
            [[ "${draft}" == true ]] || cleanup+=(--cleanup-tag)
            gh release delete "${tag}" --yes "${cleanup[@]}"
          done

  model-work:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore tests/ClankerWorld.Tests/ClankerWorld.Tests.csproj --locked-mode
      - name: Verify controlled model work with one processor
        env:
          DOTNET_PROCESSOR_COUNT: 1
        run: dotnet test tests/ClankerWorld.Tests/ClankerWorld.Tests.csproj --configuration Release --no-restore --filter FullyQualifiedName~ModelWorkHarnessTests
